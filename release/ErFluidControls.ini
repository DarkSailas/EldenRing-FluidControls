; ============================================================
;  ErFluidControls Configuration
; ============================================================

[Dodge]
; Instant dodge on Space tap (removes 200ms hold delay). Disable for standard ER behavior.
InstantDodge = false

; Virtual key-tap duration for instant dodge (ms). Only used when InstantDodge = true.
TapDurationMs = 25

[Sprint]
; Toggle Sprint on Alt key. Disable for standard ER behavior (hold Space to sprint).
ToggleSprint = false

; Hold Sprint: sprint only while Alt is held. Disable for standard ER behavior.
HoldSprint = false

; Sprint toggle/hold key: LeftAlt, LeftShift, CapsLock
SprintKey = LeftAlt

; SmartWASD: auto-disengage sprint when no WASD pressed. Only used with ToggleSprint/HoldSprint.
SmartWASD = true

; Minimum hold duration before releasing sprint key (ms). Prevents accidental roll.
MinHoldDurationMs = 380

; Resume sprint after rolling. Only used with ToggleSprint/HoldSprint.
ResumeAfterRoll = false

; Sprinting costs no stamina (on foot and mounted). Rolls and attacks still consume stamina normally.
InfiniteSprintStamina = true

[Input]
; Suspend the mod hotkeys while the chat is open (Enter toggles).
ChatSuspend = true

[LockOn]
; Keep the locked target: no switching on mouse movement and no automatic
; jump to another enemy. Press the lock-on key again to pick a new target.
DisableTargetSwitch = true

; Do not drop the lock when the target is briefly out of sight (behind a wall, pillar, another enemy).
PreventLockBreak = true

[Debug]
; Enable debug logging (false for production)
Logging = false
